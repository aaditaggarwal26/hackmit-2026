[project]
name = "orbit"
version = "0.4.0"
description = "Orbit ground station: per-slot downlink arbitration for a small EO constellation"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3",
    "pillow>=11",
    "nvidia-ml-py>=13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
gpu = ["torch>=2.14"]

[project.scripts]
orbit = "orbit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit", "viz", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["orbit", "viz", "tools"]

[[tool.mypy.overrides]]
module = ["pynvml", "torch", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
per-file-ignores = { "tests/*" = ["E501"] }
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "SIM108", "E741", "RUF001", "RUF002", "RUF003"]
